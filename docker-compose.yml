# Sobe o Manutenciona inteiro do zero:  docker compose up --build
#   Frontend: http://localhost:4200
#   API:      http://localhost:8080  (health: /actuator/health)
#   Banco:    localhost:5432 (postgres/postgres, base "manutenciona")
services:
  postgres:
    image: postgres:16-alpine
    container_name: manutenciona-db
    environment:
      POSTGRES_DB: manutenciona
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manutenciona"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: manutenciona-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/manutenciona
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: manutenciona-web
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
