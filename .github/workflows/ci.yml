name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint, build, testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: manutenciona
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d manutenciona"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Lint (Checkstyle)
        run: mvn -B checkstyle:check
      - name: Build e testes
        run: mvn -B verify

  frontend:
    name: frontend (lint, build, testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint (Prettier)
        run: npm run lint
      - name: Testes
        run: npm run test:ci
      - name: Build
        run: npm run build

  compose:
    name: docker compose (sobe do zero)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up --build --wait
        run: docker compose up --build --wait --wait-timeout 240
      - name: Smoke test
        run: |
          curl -fs http://localhost:8080/actuator/health
          curl -fs http://localhost:8080/api/salas
          curl -fs http://localhost:4200/ | grep -q "<app-root"
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
      - name: Derrubar
        if: always()
        run: docker compose down -v
